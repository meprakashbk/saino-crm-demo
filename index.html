<!doctype html>
<html lang="en-GB">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saino Events Studio · Today inbox + Events board (design demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5a40'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23e0c88a'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Saino Studio, Today inbox + Events board. Light by default (all-day use on a phone), dark on request. Gold is decoration; green carries actions. */
:root{
  --bg:#f8f4ea;--surface:#fffefa;--sunk:#f0eadb;--ink:#1b3a30;--muted:#52665c;--line:#ddd3bc;--edge:#7d8a80;
  --pri:#0b5a40;--on-pri:#fffefa;--gold:#c5a059;--goldt:#7a5c14;--bad:#a3271a;--ok:#1d6b3f;--warn:#7a560a;
  --focus:#0b5a40;--shadow:0 1px 2px #1b3a3014,0 8px 24px #1b3a3012;color-scheme:light;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1c16;--surface:#15281f;--sunk:#0b1612;--ink:#f3eddc;--muted:#b3c3ba;--line:#2f473b;--edge:#6f8a7b;
  --pri:#e0c88a;--on-pri:#12261d;--gold:#c5a059;--goldt:#e0c88a;--bad:#ffb4a2;--ok:#9fe0b8;--warn:#e8c46a;
  --focus:#e0c88a;--shadow:0 1px 2px #0006,0 8px 24px #0005;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1c16;--surface:#15281f;--sunk:#0b1612;--ink:#f3eddc;--muted:#b3c3ba;--line:#2f473b;--edge:#6f8a7b;
  --pri:#e0c88a;--on-pri:#12261d;--gold:#c5a059;--goldt:#e0c88a;--bad:#ffb4a2;--ok:#9fe0b8;--warn:#e8c46a;
  --focus:#e0c88a;--shadow:0 1px 2px #0006,0 8px 24px #0005;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--pri);color:var(--on-pri);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 14px 18px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:26px}
.brand{font:600 30px/1 var(--display);padding:0 10px;letter-spacing:.01em}
.brand small{display:block;font:500 12px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--goldt);margin-top:8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .n{margin-left:auto;font-size:13px;min-width:22px;text-align:center;border-radius:99px;padding:0 7px;background:var(--pri);color:var(--on-pri);font-weight:600}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted);padding:0 4px}
.col{min-width:0}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 28px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.bar .brand{display:none;padding:0;margin-right:auto;font-size:26px}
main{max-width:1120px;margin:0 auto;padding:8px 28px 64px}
main:focus,main:focus-visible{outline:none}
.tabbar{display:none}

/* parts */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--edge);background:var(--surface);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1.5px solid var(--edge);background:var(--surface)}
.ib:hover{border-color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--goldt);text-decoration:underline;text-underline-offset:3px;min-height:24px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 12px;font-size:13px}
.chip.demo{border-color:var(--gold);color:var(--goldt);font-weight:500;white-space:nowrap}
.pill{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:0 10px;font-size:13px;line-height:22px;white-space:nowrap;font-weight:500;background:color-mix(in srgb,currentColor 9%,transparent)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.gold{color:var(--goldt)}.pill.mute{color:var(--muted)}
.eyebrow{font:500 13px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--goldt)}
.page-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin:12px 0 22px}
.page-h h1{font:600 40px/1.05 var(--display)}
.page-h p.sub{color:var(--muted);margin-top:6px;max-width:48ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
h2.sec,h3.sec{font:600 13px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--goldt);margin:0 0 10px}
.stack>*+*{margin-top:12px}

/* pipeline strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.strip button{background:none;border:0;border-left:1px solid var(--line);padding:12px 14px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.strip button:first-child{border-left:0}
.strip button:hover{background:var(--sunk)}
.strip b{font:600 26px/1 var(--body)}
.strip span{font-size:14px;color:var(--muted)}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:16px 18px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .mark{width:10px;height:10px;border-radius:99px;background:var(--gold);align-self:start;margin-top:8px}
.task.late .mark{background:var(--bad)}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task .s{color:var(--muted);font-size:15px}
.task .acts{display:flex;gap:6px;align-items:center}
.task.wait .t{font-weight:500}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.date{flex:none;width:54px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;line-height:1.1;background:var(--sunk)}
.date b{display:block;font:600 20px/1 var(--body)}
.date i{font:500 11px/1.3 var(--body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--goldt)}

/* board */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{min-height:40px;padding:0 14px;border:1px solid var(--edge);background:var(--surface);border-radius:99px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.board{display:grid;grid-template-columns:repeat(5,minmax(176px,1fr));gap:12px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity}
.lane{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px;scroll-snap-align:start}
.lane h3{font:600 13px/1.4 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--goldt);display:flex;justify-content:space-between;gap:8px;padding:2px 4px}
.ecard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.ecard:hover{border-color:var(--ink)}
.ecard .t{font-weight:600;display:block}
.ecard .s{font-size:14px;color:var(--muted);display:block}
.ecard .nx{font-size:14px;font-weight:500;display:block;margin-top:2px}
.dots{display:flex;gap:4px;margin:2px 0}
.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--ok)}.dots i.cur{background:var(--gold)}
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.rail li{font-size:12px;color:var(--muted);text-align:center}
.rail li::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.rail li.done::before{background:var(--ok)}.rail li.cur::before{background:var(--gold)}
.rail li.done{color:var(--ink)}.rail li.cur{color:var(--ink);font-weight:600}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .h{background:var(--sunk);padding:8px;font:500 12px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--goldt)}
.cal .d{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-radius:0;min-width:0}
.cal .d:hover{background:var(--sunk)}
.cal .d.out{background:var(--bg)}
.cal .d.today .n{background:var(--pri);color:var(--on-pri);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-weight:600}
.cal .d.sel{outline:3px solid var(--focus);outline-offset:-3px}
.cal .n{font-size:14px;color:var(--muted);width:26px;height:26px;display:grid;place-items:center}
.ev{font-size:12px;line-height:1.3;padding:2px 6px;border-radius:4px;border-left:3px solid var(--ok);background:var(--sunk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ev.q{border-left:3px dashed var(--warn)}.ev.m{border-left:3px dotted var(--muted)}.ev.x{border-left:3px double var(--bad)}
.cal .dd{display:none;gap:4px;flex-wrap:wrap;justify-content:center}
/* status shapes: circle confirmed, ring quote, square meeting/enquiry, diamond stock short (not colour alone) */
.dd i,.legend i{display:inline-block;width:10px;height:10px;border-radius:99px;background:var(--ok);box-sizing:border-box}
.dd i.q,.legend i.q{background:none;border:2px solid var(--warn)}
.dd i.m,.legend i.m{border-radius:2px;background:var(--muted)}
.dd i.x,.legend i.x{border-radius:1px;background:var(--bad);transform:rotate(45deg) scale(.9)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:12px 2px}
.legend i{margin-right:8px;vertical-align:-1px}
.clist .row{padding:14px 18px;border-top:1px solid var(--line)}
.clist .row:first-child{border-top:0}

/* lists / stock */
.tbl{display:flex;flex-direction:column}
.tr{display:grid;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
button.tr:hover{background:var(--sunk)}
.tr.hd{font:500 12px/1.4 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--goldt);border-top:0;padding-top:14px}
.tr:first-child{border-top:0}
.evl{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 110px 150px minmax(0,1.5fr);align-items:start}
.phd{display:none}
.stock{grid-template-columns:minmax(0,2fr) 60px 70px 60px minmax(80px,1fr) 90px}
.cust{grid-template-columns:minmax(0,2fr) 90px 150px minmax(0,1.4fr)}
.pay{grid-template-columns:minmax(0,1.4fr) 92px 84px 84px 92px 136px 296px}
.rev{grid-template-columns:minmax(0,1.4fr) 96px minmax(0,1.2fr) 150px 268px}
.pay .pa,.rev .ra{justify-content:flex-end;flex-wrap:nowrap}
.pay .ps,.rev .rs{padding-left:12px}
.pay .ps,.rev .rs{justify-self:start}
.pm,.nd{display:none}
.page-h.top{align-items:flex-start}
.kpi b,.strip b,.money b,.date b{font-family:var(--body);font-weight:600;font-variant-numeric:tabular-nums lining-nums}
@media (max-width:1240px){
  .pay{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c s" "m m" "a a";gap:8px 12px}
  .pay.hd,.rev.hd{display:none}
  .pay .ps,.rev .rs{padding-left:0}
  .pay .pc{grid-area:c}.pay .ps{grid-area:s;justify-self:end}.pay .pm{grid-area:m;display:block}.pay .pa{grid-area:a;justify-content:flex-start}
  .pay .pe,.pay .pt,.pay .pp,.pay .pb{display:none}
  .rev{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c s" "q q" "a a";gap:8px 12px}
  .rev .rc{grid-area:c}.rev .rs{grid-area:s;justify-self:end}.rev .rq{grid-area:q}.rev .ra{grid-area:a;justify-content:flex-start}.rev .rd{display:none}
  .nd{display:inline}
}
.num{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter u{display:block;height:100%;background:var(--ok)}.meter u.o{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi b{display:block;font:600 32px/1.05 var(--body)}
.kpi span{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;min-height:42px;padding:0 18px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lab{font-weight:500;font-size:15px}
input,select,textarea{background:var(--surface);border:1.5px solid var(--edge);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.toolbar>p{align-self:flex-end}
.toolbar .field{margin:0;min-width:190px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:#0b1612a6}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 28px;box-shadow:-10px 0 40px #0006}
.sheet .x{position:sticky;top:0;float:right;z-index:4}
.sheet h2.ttl{font:600 34px/1.05 var(--display);margin:4px 0 8px;outline:none}
.sheet .blk{margin-top:22px}
.sheet .pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stick{position:sticky;bottom:0;z-index:3;background:var(--bg);margin:16px -24px -28px;padding:12px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.stick p{margin-bottom:8px}
.next{border:1.5px solid var(--gold);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.next .k{font-weight:600;font-size:18px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0 0 0 8px;border-left:2px solid var(--line)}
.log li{position:relative;padding:0 0 14px 18px;font-size:15px}
.log li::before{content:"";position:absolute;left:-6px;top:7px;width:9px;height:9px;border-radius:99px;background:var(--gold)}
.log time{display:block;font-size:13px;color:var(--muted)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.money div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.money b{display:block;font:600 22px/1.1 var(--body)}
.money span{font-size:13px;color:var(--muted)}
.qline{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:8px;align-items:center;margin-bottom:8px}
.acts-row{display:flex;gap:10px;flex-wrap:wrap}
.warnbox{border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:15px;background:color-mix(in srgb,var(--bad) 8%,transparent)}
.okbox{border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:15px;background:color-mix(in srgb,var(--ok) 8%,transparent)}
.av{width:40px;height:40px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font:600 15px/1 var(--body);color:var(--goldt);flex:none}
.desc{white-space:pre-line;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:4px}
.row.ag{border-left:4px solid var(--ok);padding-left:12px}.row.ag.held{border-left-style:dashed;border-left-color:var(--warn)}.row.ag.meet{border-left-style:dotted;border-left-color:var(--muted)}
.said{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:0;font-size:17px;line-height:1.5}
.sres{margin-top:14px}
.clinks{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 16px}
.clink{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.clink:hover{color:var(--goldt)}
.clink.wa svg{color:var(--ok)}
.datehint{display:block;margin-top:3px}
::placeholder{color:var(--muted);opacity:1}
a[href^="tel:"]{display:inline-flex;align-items:center;min-height:44px}
.task .acts{flex-wrap:wrap}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;accent-color:var(--pri);flex:none;cursor:pointer}
.prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow .pn{grid-column:1/-1}
.prow:first-child{border-top:0}
.pk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.pki{flex-direction:column;align-items:flex-start;gap:2px;min-height:0}
.pki input{width:84px;min-height:40px}
.brow{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr) minmax(0,auto);gap:12px;align-items:center;padding:8px 0}
.bv{font-size:14px;color:var(--ink);text-align:right}
.track{height:12px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:block}
.track u{display:block;height:100%;background:var(--ok)}

}

function dateHints(root){root.querySelectorAll('input[type=date]').forEach(i=>{let h=i.nextElementSibling;if(!h||!h.classList.contains('datehint')){h=document.createElement('span');h.className='datehint muted small';h.setAttribute('aria-hidden','true');i.after(h)}h.textContent=i.value?fmtLong(i.value):''})}
function render(){
  if(!S.items)S.items=JSON.parse(JSON.stringify(ITEMS0));ITEMS=S.items;
  tick();gsync();drawNav();
  const fm=document.activeElement&&document.activeElement.id==='q'?document.activeElement.selectionStart:null;
  $('#main').innerHTML=VIEWS[view]();
  if(fm!==null){const n=$('#q');n.focus();n.setSelectionRange(fm,fm)}
  drawSheet();drawClient();
  const sh=!!sheet,cl=!!clientView;document.body.classList.toggle('print-doc',!!(clientView&&clientView.doc));
  ['#shell','#tabbar'].forEach(s=>{$(s).inert=sh||cl});$('#sheet-root').inert=cl;
  document.body.style.overflow=sh||cl?'hidden':'';
  dateHints(document);
  save();
}
function go(v){clearToast();view=v;try{history.replaceState(null,'','#'+v)}catch(e){}sheet=null;clientView=null;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function setTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);try{localStorage.setItem(TKEY,t)}catch(e){}}
setTheme(localStorage.getItem(TKEY)||'auto');
document.addEventListener('click',e=>{
  const ml=e.target.closest('a[href^="mailto:"]');
  if(ml){const em=decodeURIComponent(ml.getAttribute('href').slice(7));let left=false;const mark=()=>{left=true};
    window.addEventListener('blur',mark,{once:true});document.addEventListener('visibilitychange',mark,{once:true});
    try{navigator.clipboard.writeText(em).catch(()=>{})}catch(x){}
    toast('Opening your email app for '+em+'…');
    setTimeout(()=>{window.removeEventListener('blur',mark);document.removeEventListener('visibilitychange',mark);if(left||document.hidden)return;
      const w=window.open(gmailUrl(em),'_blank');
      if(w){try{w.opener=null}catch(x){}toast('No email app opened on this device, so Gmail opened in a new tab. The address is also copied.')}
      else{mailAlt=em;sheet={k:'mailweb',id:'',back:sheet&&['b','c','day'].includes(sheet.k)?{k:sheet.k,id:sheet.id}:null};render()}},1500);
    return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,b=id?book(id):null;
  if(a==='nav')go(t.dataset.v);
  else if(a==='board'){typeF='All';go('board')}
  else if(a==='open'){const bk=t.dataset.back?{k:t.dataset.back.split(':')[0],id:t.dataset.back.split(':')[1]}:null;
    open(t.dataset.k,id,bk||(sheet&&['b','c'].includes(sheet.k)&&t.dataset.k!=='b'&&t.dataset.k!=='c'?{k:sheet.k,id:sheet.id}:null))}
  else if(a==='close')closeSheet();
  else if(a==='doc'){clientView={id,doc:t.dataset.t,fresh:true};render()}
  else if(a==='savedoc'){saveDay(b);log(b,'Event-day sheet saved');clientView={id,doc:'day',fresh:true};render()}
  else if(a==='print'){window.print()}
  else if(a==='packall'){const w=t.dataset.t;b.pack=b.pack||{out:{},back:{},issue:{}};Object.keys(b.items).forEach(k=>{b.pack[w][k]=true});log(b,w==='out'?'Everything loaded for the event':'Everything returned from the event');toast(w==='out'?'Everything marked as loaded.':'Everything marked as returned.');render()}
  else if(a==='rperiod'){repP=t.dataset.t;render()}
  else if(a==='export'){doExport(t.dataset.t)}
  else if(a==='copysum'){const tx=weeklyText();try{navigator.clipboard.writeText(tx).then(()=>toast('Summary copied.'),()=>toast('Could not copy. Select the text and copy it.'))}catch(x){toast('Could not copy. Select the text and copy it.')}}
  else if(a==='gtab'){gtab=t.dataset.t;drawSheet()}
  else if(a==='gtoggle'){const was=S.g.on,n=gPending();S.g.on=!S.g.on;if(!was)toast(n?'Sync resumed. '+n+(n===1?' change':' changes')+' sent to Google (demo: nothing really sent).':'Sync resumed.');else toast('Sync paused. Changes will wait until you resume.');render()}
  else if(a==='more'){showAll=!showAll;render()}
  else if(a==='type'){typeF=t.dataset.t;render()}
  else if(a==='evmode'){evMode=t.dataset.t;try{localStorage.setItem('saino-crm-v2-inbox-evmode',evMode)}catch(x){}render();const n=document.querySelector('[data-a=evmode][data-t="'+evMode+'"]');n&&n.focus({preventScroll:true})}
  else if(a==='mtab'){moneyTab=t.dataset.t;render()}
  else if(a==='cmode'){calMode=t.dataset.t;render()}
  else if(a==='sel'){selDate=t.dataset.d;render();const d=document.querySelector('.cal .d.sel');d&&d.focus({preventScroll:true})}
  else if(a==='cal'){cal.m+=+t.dataset.n;if(cal.m<1){cal.m=12;cal.y--}if(cal.m>12){cal.m=1;cal.y++}render()}
  else if(a==='gocal'){selDate=t.dataset.d;const d=D(selDate);cal={y:d.getFullYear(),m:d.getMonth()+1};calMode='grid';go('calendar')}
  else if(a==='newfor'){opener=openerSel(document.activeElement);sheet={k:'new',id:'',pre:t.dataset.d};render()}
  else if(a==='snooze'){b.snooze=addDays(TODAY,2);toast('Okay. This will come back in 2 days.');render()}
  else if(a==='held'){if(b.appt.when.slice(0,10)>TODAY){toast('You can mark the meeting as held on or after the day.');return}b.appt.done=true;log(b,'Meeting held');toast('Meeting marked as held. Next: send the quote.');render()}
  else if(a==='lostask'){lostAsk=true;drawSheet()}
  else if(a==='lostno'){lostAsk=false;drawSheet()}
  else if(a==='lost'){b.stage='Lost';log(b,'Marked as lost');sheet=null;lostAsk=false;toast('Marked as lost.');render()}
  else if(a==='rm'){const bb=book(sheet.id);delete bb.items[t.dataset.k];drawSheet()}
  else if(a==='preview'){clientView={id,sent:false,fresh:true};render()}
  else if(a==='client'){clientView={id,sent:true,fresh:true};render()}
  else if(a==='closeclient'){clientView=null;render()}
  else if(a==='sendq'){if(!qOk(b)){$('#qhelp').textContent='Add at least one item and type the agreed price to send.';return}
    const n=1010+S.b.filter(x=>x.quote).length;b.quote={ref:'Q-'+n,sent:TODAY,total:+b.draft.total,msg:b.draft.msg,valid:+b.draft.valid,state:'sent'};b.draft=null;b.stage='Quote sent';
    log(b,'Quote '+b.quote.ref+' sent online (demo: no email is really sent)');sheet={k:'b',id:b.id};toast('Quote sent. It confirms by itself when the client accepts.');clientView={id:b.id,sent:true,fresh:true};render()}
  else if(a==='accept'){if(qExp(b))return;b.quote.state='accepted';b.quote.acc=TODAY;b.stage='Confirmed';log(b,'Client accepted the quote online. Confirmed automatically and stock reserved.');toast('Accepted. This event is now confirmed.');render()}
  else if(a==='recv'){b.rev.recv=TODAY;log(b,'Client left a Google review (ticked by Saino)');toast('Marked as received.');render()}
  else if(a==='copy'){const ta=$('#mtx');try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent='Copied'},()=>{ta.select();t.textContent='Press Ctrl+C'})}catch(x){ta.select()}}
  else if(a==='sendmsg'){const k=t.dataset.k,ch=vl(M.ch);
    if(k==='bal'){b.reqs=(b.reqs||0)+1;b.lastReq=TODAY;log(b,'Balance request for '+money(bal(b))+' sent by '+ch+' (demo: not really sent)');toast('Balance request recorded. Nothing was really sent in this demo.')}
    else if(k==='msg'){b.replied=TODAY;log(b,'Message sent by '+ch+' (demo: not really sent)');toast('Message recorded. Nothing was really sent in this demo.')}
    else{const r=b.rev;if(!r.sent){r.sent=TODAY;log(b,'Google review request sent by '+ch+' (demo: not really sent)')}else{r.n=(r.n||0)+1;r.last=TODAY;log(b,'Google review request sent again by '+ch+' (demo: not really sent)')}toast('Review request recorded. Nothing was really sent in this demo.')}
    sheet={k:'b',id:b.id};M=null;render()}
  else if(a==='clock'){const n=+t.dataset.n;if(n===0){S=fresh();TODAY=START}else{TODAY=addDays(TODAY,n)}S.today=TODAY;selDate=TODAY;const d=D(TODAY);cal={y:d.getFullYear(),m:d.getMonth()+1};render()}
  else if(a==='theme'){setTheme(t.dataset.t);drawSheet()}
  else if(a==='simform'){const nb=simEnquiry();if(!nb){toast('The sample enquiry is already here. Reset to see it arrive again.');return}view='today';try{history.replaceState(null,'','#today')}catch(x){}sheet={k:'b',id:nb.id,back:null};toast('New website enquiry from Anita G. An instant reply went to her and both founders were told (demo: nothing really sent).');render()}
  else if(a==='copyaddr'){try{navigator.clipboard.writeText(mailAlt).then(()=>toast('Address copied: '+mailAlt),()=>toast('Could not copy. The address is '+mailAlt))}catch(x){toast('The address is '+mailAlt)}}
  else if(a==='resetask'){resetAsk=true;drawSheet()}
  else if(a==='resetno'){resetAsk=false;drawSheet()}
  else if(a==='reset'){resetAsk=false;S=fresh();TODAY=START;selDate=START;cal={y:2026,m:11};toast('Sample data reset.');render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(clientView){clientView=null;render()}else if(sheet)closeSheet()}
  if(e.key==='/'&&!sheet&&!clientView&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||'')){e.preventDefault();open('search')}
  if(e.key==='Tab'){const root=clientView?$('#client-root'):sheet?$('#sheet-root'):null;if(!root)return;
    const f=[...root.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="-1"]')].filter(x=>x.offsetParent!==null&&!(x.tabIndex<0&&!x.matches('#sh-t,#cl-t')));
    if(!f.length)return;const fi=f[0],la=f[f.length-1];
    if(e.shiftKey&&document.activeElement===fi){e.preventDefault();la.focus()}else if(!e.shiftKey&&document.activeElement===la){e.preventDefault();fi.focus()}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.type==='date'){const h=t.nextElementSibling;if(h&&h.classList&&h.classList.contains('datehint'))h.textContent=t.value?fmtLong(t.value):''}
  if(t.id==='q'){q=t.value;render()}
  else if(t.id==='sq'){$('#sres').innerHTML=resHTML(t.value)}
  else if(t.id==='qtot'||t.id==='qmsg'){const b=book(sheet.id);b.draft[t.id==='qtot'?'total':'msg']=t.value;const ok=qOk(b),s=$('#sendq');if(s){ok?s.removeAttribute('aria-disabled'):s.setAttribute('aria-disabled','true')}const hp=$('#qhelp');if(hp)hp.textContent=ok?'Ready to send.':'Add at least one item and type the agreed price to send.'}
  else if(t.id==='mtx'){M.text=t.value}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.pk){packChange(t);return}
  if(t.id==='cnote'){cust(t.dataset.cid).notes=t.value;save()}
  else if(t.id==='qval'){book(sheet.id).draft.valid=t.value;save()}
  else if(t.id==='qadd'&&t.value){book(sheet.id).items[t.value]=1;drawSheet();const q=$('#qadd');q&&q.focus()}
  else if(t.dataset.qty){book(sheet.id).items[t.dataset.qty]=Math.max(1,+t.value||1);drawSheet()}
  else if(t.id==='mch'){M.ch=t.value;const b=book(sheet.id);M.text=sheet.k==='bal'?msgBal(b,t.value):sheet.k==='msg'?msgGen(b,t.value):msgRev(b,t.value);$('#mtx').value=M.text}
  else if(t.id==='revd'){S.cfg.revDays=+t.value;S.b.forEach(b=>{if(b.rev&&!b.rev.sent)b.rev.due=addDays(b.date,S.cfg.revDays)});render()}
  else if(t.id==='invd'){invDate=t.value||invDate;render()}
  else if(t.id==='catf'){catF=t.value;render()}
  else if(t.id==='evst'){evStage=t.value;render();const n=$('#evst');n&&n.focus()}
  else if(t.id==='evsort'){evSort=t.value;render();const n=$('#evsort');n&&n.focus()}
  else if(t.id==='chk'){chk=t.value;render();const n=$('#chk');n&&n.focus()}
});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
  if(f.id==='af'){const b=book(f.dataset.id);b.appt={when:$('#ad').value+'T'+$('#at').value,place:$('#ap').value,via:$('#av').value,done:false};b.stage='Meeting booked';
    log(b,'Client contacted by '+vl(b.appt.via)+'. Meeting booked for '+fmtWhen(b.appt.when)+' ('+b.appt.place.toLowerCase()+'). Moved on automatically.');sheet={k:'b',id:b.id};toast('Meeting booked. This enquiry moved on by itself.');render()}
  else if(f.id==='df'){const b=book(f.dataset.id);saveDay(b);log(b,'Event-day sheet saved');sheet={k:'b',id:b.id};toast('Event-day sheet saved.');render()}
  else if(f.id==='cf'){const c=cust(f.dataset.id),nm=$('#cn').value.trim();if(!nm){const e=$('#cn');e.setCustomValidity('Please type a name.');e.reportValidity();e.addEventListener('input',()=>e.setCustomValidity(''),{once:true});return}c.name=nm;c.phone=$('#cp').value.trim()||'[phone to add]';c.email=$('#ce').value.trim()||'[email to add]';const bk=sheet.back;sheet=bk?{k:bk.k,id:bk.id,back:null}:{k:'c',id:c.id,back:null};toast('Contact saved.');render()}
  else if(f.id==='if'){const nm=$('#in').value.trim(),tt=Math.max(1,Math.round(+$('#iq').value||1)),rp=Math.max(0,Math.round(+$('#ir').value||0));if(!nm){const e=$('#in');e.setCustomValidity('Please type a name.');e.reportValidity();e.addEventListener('input',()=>e.setCustomValidity(''),{once:true});return}if(rp>tt){const e=$('#ir');e.setCustomValidity('This cannot be more than you own ('+tt+').');e.reportValidity();e.addEventListener('input',()=>e.setCustomValidity(''),{once:true});return}let it=f.dataset.id?item(f.dataset.id):null;const isNew=!it;if(!it){it={id:'it'+Date.now()%100000};ITEMS.push(it)}Object.assign(it,{name:nm,cat:$('#ic').value,total:tt,rep:rp,cond:rp>0?'Needs repair':'Good'});sheet={k:'i',id:it.id,back:null};toast(isNew?'Item added.':'Item saved.');render()}
  else if(f.id==='pf'){const b=book(f.dataset.id),a=Math.round(+$('#pa').value*100)/100,er=$('#paerr');if(!(a>0))return;if(a>bal(b)+0.001){er.hidden=false;er.textContent=bal(b)>0?'That is more than the balance of '+money(bal(b))+'. Check the amount.':'This booking is already paid in full.';$('#pa').focus();return}b.pay.push({d:$('#pd').value,a,m:$('#pm').value,n:$('#pn').value});
    log(b,'Payment of '+money(a)+' received ('+$('#pm').value.toLowerCase()+')');if(bal(b)===0)log(b,'Paid in full');sheet={k:'b',id:b.id};toast(bal(b)===0?'Paid in full.':'Payment saved. Balance is now '+money(bal(b))+'.');render()}
  else if(f.id==='ef'){const b=book(f.dataset.id);b.type=$('#et').value;b.date=$('#ed').value;b.venue=$('#ev').value||'Not chosen';b.guests=+$('#eg').value||b.guests;log(b,'Event details changed ('+fmt(b.date)+', '+b.venue+', '+b.guests+' guests)');sheet={k:'b',id:b.id};toast('Details saved.');render()}
  else if(f.id==='nf'){const id='cx'+Date.now()%100000,nm=$('#nn').value.trim();if(!nm){const e=$('#nn');e.setCustomValidity('Please type a name.');e.reportValidity();e.addEventListener('input',()=>e.setCustomValidity(''),{once:true});return}
    S.c.push({id,name:nm,phone:$('#np').value.trim()||'[phone to add]',email:$('#nm').value.trim()||'[email to add]',notes:''});
    const nb=prep({id:'bx'+Date.now()%100000,cid:id,type:$('#nt').value,date:$('#nd').value,venue:$('#nv').value||'Not chosen',guests:+$('#ng').value||0,stage:'New enquiry',src:$('#ns').value,rec:TODAY});
    nb.log=[{d:TODAY,t:'Enquiry received from '+$('#ns').value}];S.b.push(nb);sheet=null;toast('Enquiry added. First step: book a meeting.');go('today')}
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==view){view=v;sheet=null;clientView=null;render()}});
if(!VIEWS[view])view='today';
render();
